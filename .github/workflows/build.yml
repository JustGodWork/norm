name: Build dist

# Publishes dist/ on master. Nothing else triggers it: merging a PR into
# master IS a push to master, so a pull_request trigger would only duplicate
# the run. Checks on open PRs live in test.yml, which publishes nothing.
on:
  push:
    branches: [master]

# Allow the workflow to commit the built dist/ back to the repo.
permissions:
  contents: write

# One publishing run at a time. The group is a constant, not github.ref, so
# concurrent runs really do collapse.
concurrency:
  group: build-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # The bot's own push carries "[skip ci]", which GitHub honours by not
    # creating a workflow run at all: that is what breaks the loop. An actor
    # check would not, because actions/checkout persists SUBMODULES_PAT and the
    # push is therefore attributed to the PAT owner, never to the bot.

    steps:
      # 1. Checkout WITH submodules (the build needs them).
      #    Submodules are private, so we authenticate with a PAT that has
      #    read access to those repositories. Store it as a repo secret
      #    named SUBMODULES_PAT (Settings > Secrets and variables > Actions).
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}
          fetch-depth: 0

      # 2. Install Lua 5.4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          lua5.4 -v

      # 3. Run the build
      - name: Run build.lua
        run: lua5.4 build.lua

      # 4. Run the test suites against the freshly built bundle. They run real
      #    Lua 5.4 through lupa, so a regression stops the job before dist/ is
      #    published rather than after.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lupa
        run: pip install lupa

      - name: Run the self-test
        run: python tests/run.py

      - name: Run the nanos adapter test
        run: python tests/run_nanos.py

      # 5. Commit + push dist/ only if it actually changed
      - name: Commit dist/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the dist/ folder
          git add dist/

          # If nothing changed, exit cleanly (no empty commit)
          if git diff --cached --quiet; then
            echo "dist/ unchanged, nothing to commit."
            exit 0
          fi

          git commit -m "build(dist): rebuild distribution files [skip ci]"

          # Explicit refspec: works whether or not the checkout left us on a
          # named branch, instead of failing with "not currently on a branch".
          git push origin HEAD:master